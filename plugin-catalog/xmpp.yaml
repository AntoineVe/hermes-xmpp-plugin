# Hermes plugin catalog entry for the XMPP platform adapter.
#
# This is a DRAFT kept on Gitea. It is NOT submitted to the
# NousResearch/hermes-agent plugin-catalog/ directory yet.
#
# Open items before submission:
#   - `sha`: pin the exact 40-hex commit AFTER more testing (leave commented out below).
#   - `version`: add once a sha is pinned (cosmetic label, e.g. "1.4.0").
#   - `name`: catalog key "xmpp" (independent of the manifest `name:`).
#     See the manifest-rename note at the bottom of this file.

name: xmpp
repo: https://github.com/rebelcommand/hermes-xmpp-plugin
# sha: <40-hex commit sha>   # pin after testing; mandatory before submission
description: >-
  XMPP gateway adapter for Hermes Agent. Connects to an XMPP server and relays
  messages between XMPP users and the Hermes agent. OMEMO end-to-end
  encryption is enabled by default when slixmpp-omemo is installed.
maintainer: rebelcommand
tier: community
category: platform
docs_url: https://github.com/rebelcommand/hermes-xmpp-plugin#readme
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env:
  - XMPP_USER_JID
  - XMPP_PASSWORD
  - XMPP_ALLOWED_USERS

# --- Notes ---
# `requires_hermes` is intentionally omitted: the plugin has always worked
# across Hermes versions and there is no known minimum we can state honestly.
#
# `platforms` is omitted (empty = all OS).
#
# `image` is omitted (optional; must be an https URL on a GitHub host, pinned
# to the entry commit).
#
# MANIFEST NAME VS CATALOG NAME:
# The catalog `name:` key above ("xmpp") is independent of the plugin's
# manifest `name:` (currently "xmpp-platform" in plugin.yaml). The catalog
# key is what users type in `hermes plugins install <name>`; the manifest
# name is what the installer derives the install directory and
# `plugins.enabled` key from. They do not need to match.
#
# If the manifest name is later renamed xmpp-platform -> xmpp, that is a
# SEPARATE shipped-behaviour change requiring its own version bump, release,
# and a migration of the `plugins.enabled` key (existing installs record
# "xmpp-platform", which would become a legacy key alongside "platforms/xmpp").
